plugins {
    id 'java'
}

repositories {
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }
    mavenCentral()
}

def runeLiteVersion = '1.12.37'
def pluginMainClass = 'com.osrsflipper.sync.OsrsFlipperSyncPluginTest'

dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"

    testImplementation 'junit:junit:4.13.2'
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:jshell:${runeLiteVersion}"
}

dependencyLocking {
    lockAllConfigurations()
}

group = 'com.osrsflipper'
version = '5.2.32'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

// The development main class is not a JUnit test. Keep Gradle's empty-suite
// failure enabled so broken test discovery cannot silently pass the build.
tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    exclude 'com/osrsflipper/sync/OsrsFlipperSyncPluginTest.class'
    doFirst {
        // RuneLite and its default logger resolve files from user.home during
        // static initialization. Set the forked JVM properties before any test
        // classes load, using a fresh directory for each actual test execution.
        def testRoot = layout.buildDirectory.dir('test-runtime').get().asFile.toPath()
        java.nio.file.Files.createDirectories(testRoot)
        def executionRoot = java.nio.file.Files.createTempDirectory(testRoot, "${name}-")
        def testHome = java.nio.file.Files.createDirectory(executionRoot.resolve('home')).toString()
        def testTemporary = java.nio.file.Files.createDirectory(executionRoot.resolve('tmp')).toString()
        systemProperty 'user.home', testHome
        systemProperty 'java.io.tmpdir', testTemporary
        systemProperty 'osrsflipper.test.home', testHome
    }
}

tasks.register('run', JavaExec) {
    // The development entry point lives in test classes; test-only logging and
    // fixtures must not configure the real RuneLite client.
    classpath = sourceSets.test.runtimeClasspath - files(sourceSets.test.output.resourcesDir)
    mainClass = pluginMainClass
    jvmArgs '-ea'
    args '--developer-mode'
}

tasks.register('shadowJar', Jar) {
    dependsOn configurations.testRuntimeClasspath
    manifest {
        attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from sourceSets.test.output
    from {
        configurations.testRuntimeClasspath.collect { file ->
            file.isDirectory() ? file : zipTree(file)
        }
    }
    exclude 'META-INF/INDEX.LIST'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude '**/module-info.class'
    exclude 'logback-test.xml'
    archiveClassifier.set('shadow')
    archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
