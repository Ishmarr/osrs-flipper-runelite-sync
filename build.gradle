plugins {
    id 'java'
}

repositories {
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }
    mavenCentral()
}

def runeLiteVersion = '1.12.37'
def pluginMainClass = 'com.osrsflipper.sync.OsrsFlipperSyncPluginTest'

dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"

    testImplementation 'junit:junit:4.13.2'
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:jshell:${runeLiteVersion}"
}

dependencyLocking {
    lockAllConfigurations()
}

group = 'com.osrsflipper'
version = '5.2.31'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

// The development main class is not a JUnit test. Keep Gradle's empty-suite
// failure enabled so broken test discovery cannot silently pass the build.
tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    exclude 'com/osrsflipper/sync/OsrsFlipperSyncPluginTest.class'
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    jvmArgs '-ea'
    args '--developer-mode'
}

tasks.register('shadowJar', Jar) {
    dependsOn configurations.testRuntimeClasspath
    manifest {
        attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from sourceSets.test.output
    from {
        configurations.testRuntimeClasspath.collect { file ->
            file.isDirectory() ? file : zipTree(file)
        }
    }
    exclude 'META-INF/INDEX.LIST'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude '**/module-info.class'
    archiveClassifier.set('shadow')
    archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
