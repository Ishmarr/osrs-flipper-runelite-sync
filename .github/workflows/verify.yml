name: Verify plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache-jdk: false

      - name: Verify Gradle wrapper
        shell: pwsh
        run: |
          $expected = '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7'
          $actual = (Get-FileHash -LiteralPath 'gradle/wrapper/gradle-wrapper.jar' -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Unexpected Gradle wrapper JAR checksum' }

      - name: Build and run the complete isolated regression suite
        shell: pwsh
        run: .\gradlew.bat build --no-daemon --no-build-cache --console=plain
